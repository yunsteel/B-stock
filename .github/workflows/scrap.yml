name: Run 🚀

on:
  push:
  # schedule:
    # - cron: '*/30 * * * *' # 30분마다 실행하기
    
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.6'  

    - name: Run Go script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      run: go run main.go 
